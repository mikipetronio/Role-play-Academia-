<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Roleplay de Ventas - Academia Digital</title>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel compiler for JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/lucide-react@latest"></script>
</head>
<body class="bg-slate-100 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { 
      Send, Phone, PhoneOff, Award, AlertCircle, RefreshCw, 
      HelpCircle, CheckCircle, XCircle, TrendingUp, DollarSign, 
      Users, MessageSquare, ChevronRight, User, Sparkles, AlertTriangle
    } = lucideReact;

    const ACADEMY_INFO = {
      name: "Academia de Negocios Digitales",
      memberships: {
        estandar: {
          name: "ESTÁNDAR",
          priceARS: 115000,
          priceUSD: 120,
          priceBRL: 600,
          features: [
            "Marketing de Afiliados",
            "Marketing Digital Base",
            "Clases en Vivo",
            "Acompañamiento",
            "Programa de Reprogramación Mental Consciente"
          ]
        },
        premium: {
          name: "PREMIUM",
          priceARS: 235000,
          priceUSD: 240,
          priceBRL: 1200,
          features: [
            "Todo lo de Estándar",
            "Edición en Canva con Inteligencia Artificial",
            "Trading profesional",
            "Estrategias avanzadas en Hotmart"
          ]
        },
        business: {
          name: "BUSINESS",
          priceARS: 350000,
          priceUSD: 360,
          priceBRL: 1800,
          features: [
            "Todo lo de Premium",
            "E-commerce completo (Tienda Nube, Shopify y Mercado Libre)",
            "Mentoría prioritaria para escalar negocio"
          ]
        }
      }
    };

    const PROFILES = [
      {
        id: 'mama_soltera',
        title: 'Mama Soltera',
        desc: 'Busca ingresos desde casa para cuidar a sus hijos. Presupuesto acotado, poco tiempo.',
        difficulty: 'Medio',
        pain: 'Necesita flexibilidad horaria y teme no poder cumplir por falta de tiempo.',
        recommendedPlan: 'estandar'
      },
      {
        id: 'empleado_agotado',
        title: 'Empleado Exhausto',
        desc: 'Trabaja 10hs diarias en oficina. Quiere independizarse pero teme dejar su empleo.',
        difficulty: 'Fácil',
        pain: 'Hartazgo laboral, busca un sistema paso a paso para transición segura.',
        recommendedPlan: 'premium'
      },
      {
        id: 'emprendedor_estancado',
        title: 'Emprendedora Estancada',
        desc: 'Tiene un negocio físico/online que no vende. Quiere vender por redes y e-commerce.',
        difficulty: 'Medio',
        pain: 'Inversión en stock sin ventas, falta de estrategia digital clara.',
        recommendedPlan: 'business'
      },
      {
        id: 'temor_tecnologia',
        title: 'Persona con Miedo a la Tecnología',
        desc: 'Mayor de 45 años, con muchas ganas pero se siente analfabeto digital.',
        difficulty: 'Fácil',
        pain: 'Frustración tecnológica, miedo a no entender la plataforma.',
        recommendedPlan: 'estandar'
      },
      {
        id: 'interes_trading',
        title: 'Interesado en Trading',
        desc: 'Busca rentabilidad rápida. Viene impulsado por redes pero teme ser estafado.',
        difficulty: 'Difícil',
        pain: 'Desconfianza en el mercado, busca acompañamiento real y no humo.',
        recommendedPlan: 'premium'
      },
      {
        id: 'desilusionado_previo',
        title: 'Ex-alumno Desilusionado',
        desc: 'Ya compró otros cursos de Hotmart y siente que tiró su dinero.',
        difficulty: 'Difícil',
        pain: 'Escéptico total, exige saber qué hace diferente a esta academia.',
        recommendedPlan: 'premium'
      }
    ];

    function App() {
      const [gameState, setGameState] = useState('SETUP');
      const [difficulty, setDifficulty] = useState('Medio');
      const [selectedProfile, setSelectedProfile] = useState(PROFILES[0]);
      const [closeMode, setCloseMode] = useState('whatsapp');
      
      const [stage, setStage] = useState(1);
      const [messages, setMessages] = useState([]);
      const [inputText, setInputText] = useState('');
      const [isTyping, setIsTyping] = useState(false);
      const [callActive, setCallActive] = useState(false);

      const [hint, setHint] = useState(null);
      const [history, setHistory] = useState([]);
      const [evaluation, setEvaluation] = useState(null);
      const [sellerMetrics, setSellerMetrics] = useState({
        qualifiedScore: 0,
        ethicViolations: [],
        askedQuestions: 0
      });

      const chatEndRef = useRef(null);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, isTyping]);

      useEffect(() => {
        const savedHistory = localStorage.getItem('roleplay_history_v1');
        if (savedHistory) {
          try { setHistory(JSON.parse(savedHistory)); } catch (e) {}
        }
      }, []);

      const startRoleplay = () => {
        setGameState('PLAYING');
        setStage(1);
        setEvaluation(null);
        setSellerMetrics({ qualifiedScore: 0, ethicViolations: [], askedQuestions: 0 });

        const initialGreeting = selectedProfile.id === 'desilusionado_previo' 
          ? "Hola, vi sus videos. ¿Esto es otro de esos cursos de Hotmart o cómo es la onda?"
          : selectedProfile.id === 'interes_trading'
          ? "Buenas! Me interesa lo de trading. ¿Cuánto se gana al mes asegurado?"
          : "Hola!! Vi tu publicación en redes, ¿me darías más información por favor?";

        setMessages([
          { sender: 'client', text: initialGreeting, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) }
        ]);
      };

      const getHint = () => {
        let hintMsg = "";
        if (stage === 1) {
          hintMsg = "💡 <b>Pista Etapa 1:</b> Respondé con amabilidad, destacá brevemente que enseñamos negocios digitales con acompañamiento y proponé pasar a WhatsApp para enviarle la información completa.";
        } else if (stage === 2) {
          hintMsg = "💡 <b>Pista Etapa 2 (Calificación):</b> ¡No des precios todavía! Hacé preguntas abiertas: ¿A qué te dedicás hoy?, ¿Cuál es tu objetivo?, ¿Cuánto tiempo tenés por día? y si ya probaste emprender antes.";
        } else if (stage === 3) {
          hintMsg = `💡 <b>Pista Etapa 3 (Presentación):</b> Basado en su perfil, recomendale el plan <b>${ACADEMY_INFO.memberships[selectedProfile.recommendedPlan].name}</b>. Explicale CÓMO ese plan resuelve su dolor específico.`;
        } else {
          hintMsg = "💡 <b>Pista Etapa 4 (Cierre):</b> Respondé a su duda con empatía, aclarale los medios de pago y proponé una acción concreta (ej: ¿Arrancamos hoy con tarjeta o transferencia?).";
        }
        setHint(hintMsg);
      };

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!inputText.trim() || isTyping) return;

        const userMsg = {
          sender: 'seller',
          text: inputText.trim(),
          time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
        };

        const newMessages = [...messages, userMsg];
        setMessages(newMessages);
        setInputText('');
        setHint(null);

        checkEthics(userMsg.text);
        generateClientResponse(newMessages);
      };

      const checkEthics = (text) => {
        const lower = text.toLowerCase();
        const violations = [];

        if (lower.includes('ganancia garantizada') || lower.includes('100% seguro ganar') || lower.includes('te garantizo $') || lower.includes('te vas a hacer rico')) {
          violations.push("Promesa falsa de ingresos o ganancias garantizadas.");
        }
        if (lower.includes('sin riesgo') && lower.includes('trading')) {
          violations.push("Asegurar que el trading no posee riesgo.");
        }
        if (lower.includes('últimos 2 cupos') || lower.includes('se acaba en 5 minutos') || lower.includes('queda 1 lugar')) {
          violations.push("Uso de falsa escasez o urgencia manipuladora.");
        }

        if (violations.length > 0) {
          setSellerMetrics(prev => ({
            ...prev,
            ethicViolations: [...prev.ethicViolations, ...violations]
          }));
        }
      };

      const generateClientResponse = (currentChat) => {
        setIsTyping(true);

        setTimeout(() => {
          const lastSellerMsg = currentChat[currentChat.length - 1].text.toLowerCase();
          let responseText = "";
          let nextStage = stage;

          if (stage === 1) {
            if (lastSellerMsg.includes('whatsapp') || lastSellerMsg.includes('wssp') || lastSellerMsg.includes('número') || lastSellerMsg.includes('link') || lastSellerMsg.includes('escribime')) {
              nextStage = 2;
              responseText = "Dale, de una! Te paso mi WhatsApp o decime tu número y te hablo. ¿Por ahí me explicás bien cómo es la onda?";
            } else if (lastSellerMsg.includes('$') || lastSellerMsg.includes('pesos') || lastSellerMsg.includes('precio') || lastSellerMsg.includes('cuesta')) {
              responseText = "Uh, pero pasame bien la info primero che. ¿Qué es lo que enseñan exactamente?";
            } else {
              responseText = "Buenísimo. ¿Me pasás tu WhatsApp así lo charlamos mejor por ahí?";
            }
          } else if (stage === 2) {
            const isAskingQuestions = lastSellerMsg.includes('?') || lastSellerMsg.includes('cuéntame') || lastSellerMsg.includes('contame') || lastSellerMsg.includes('dedicas') || lastSellerMsg.includes('tiempo') || lastSellerMsg.includes('experiencia');

            if (lastSellerMsg.includes('$') || lastSellerMsg.includes('115') || lastSellerMsg.includes('235') || lastSellerMsg.includes('350') || lastSellerMsg.includes('precio')) {
              responseText = "Mmm... Medio saladito sin saber qué incluye. Che, pero ¿cómo son las clases? No me contaste mucho de cómo trabajan.";
            } else if (isAskingQuestions) {
              setSellerMetrics(prev => ({ ...prev, qualifiedScore: prev.qualifiedScore + 2, askedQuestions: prev.askedQuestions + 1 }));

              if (selectedProfile.id === 'mama_soltera') {
                responseText = "Mira, soy mamá soltera y la verdad no llego a fin de mes. Necesito algo para hacer desde casa a la noche cuando duermen los chicos. No sé nada de computación, ¿es muy difícil?";
              } else if (selectedProfile.id === 'empleado_agotado') {
                responseText = "Laburo 10 horas en un comercio por dos mangos. Estoy podrido de no tener tiempo libre. Busco algo digital pero me da miedo dejar el laburo sin tener ingresos fijos.";
              } else if (selectedProfile.id === 'emprendedor_estancado') {
                responseText = "Tengo mi emprendimiento pero no vendo nada por redes. Gasté en publicidad y fue tirar plata. Necesito armar una tienda online que funcione de verdad.";
              } else if (selectedProfile.id === 'interes_trading') {
                responseText = "A mí me interesa el trading pero vi mucha gente que perdió todo. ¿Ustedes enseñan de verdad o te mandan a meter plata en aplicaciones raras?";
              } else {
                responseText = "La verdad es que ya probé un curso el año pasado y me sentí estafado, nadie me contestaba las dudas. Busco algo donde haya gente real ayudándote.";
              }

              if (sellerMetrics.askedQuestions >= 1) {
                nextStage = 3;
              }
            } else {
              responseText = "Claro... ¿Y cómo sería el tema del acompañamiento y las clases?";
            }
          } else if (stage === 3) {
            if (lastSellerMsg.includes('estándar') || lastSellerMsg.includes('premium') || lastSellerMsg.includes('business') || lastSellerMsg.includes('$') || lastSellerMsg.includes('membresía')) {
              nextStage = 4;
              if (closeMode === 'llamada' && !callActive) {
                setCallActive(true);
              }

              if (difficulty === 'Difícil') {
                responseText = "Uff, la verdad se me re complica con el presupuesto ahora. ¿No tenés algo más barato o cuotas sin interés?";
              } else {
                responseText = "Suena copado lo que me contás... Pero decime una cosa, ¿qué pasa si no tengo tiempo para conectarme a las clases en vivo?";
              }
            } else {
              responseText = "Entiendo. ¿Y qué plan me recomendarías vos para mi caso y cuánto saldría?";
            }
          } else if (stage === 4) {
            if (lastSellerMsg.includes('tarjeta') || lastSellerMsg.includes('transferencia') || lastSellerMsg.includes('mercado pago') || lastSellerMsg.includes('link de pago') || lastSellerMsg.includes('grabadas') || lastSellerMsg.includes('cuotas')) {
              responseText = "¡Buenísimo! Me da mucha más confianza así. Pasame el link de pago o el CBU para el plan y me sumo de una.";
            } else if (lastSellerMsg.includes('lo tengo que pensar') || lastSellerMsg.includes('hablo con mi pareja')) {
              responseText = "Dale, dejame que lo hablo en casa a la noche y cualquier cosa te vuelvo a escribir. ¡Gracias!";
            } else {
              responseText = "Che, pero ¿puedo pagar con dos tarjetas o hacer una parte en efectivo/transferencia?";
            }
          }

          setStage(nextStage);
          setMessages(prev => [...prev, {
            sender: 'client',
            text: responseText,
            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
          }]);
          setIsTyping(false);

        }, 1200);
      };

      const finishRoleplay = () => {
        const totalMsgs = messages.filter(m => m.sender === 'seller').length;
        const isClosed = stage === 4 && messages[messages.length - 1]?.text.toLowerCase().includes('pasame el link');

        const rapportScore = Math.min(10, Math.max(4, totalMsgs > 2 ? 8 : 4));
        const qualifScore = Math.min(10, Math.max(3, sellerMetrics.askedQuestions * 3.5));
        const objecionScore = stage >= 4 ? 8 : 5;
        const ethicsScore = sellerMetrics.ethicViolations.length === 0 ? 10 : Math.max(2, 10 - (sellerMetrics.ethicViolations.length * 4));
        const finalScore = Math.round((rapportScore + qualifScore + objecionScore + ethicsScore) / 4);

        const report = {
          id: Date.now(),
          date: new Date().toLocaleDateString('es-AR'),
          profile: selectedProfile.title,
          difficulty,
          mode: closeMode,
          result: isClosed ? 'Venta Cerrada 🎉' : 'En Seguimiento / No Cerrada ⏳',
          finalScore,
          scores: {
            rapport: rapportScore,
            qualification: qualifScore,
            objections: objecionScore,
            ethics: ethicsScore
          },
          strengths: [
            totalMsgs >= 3 ? "Mantuviste una conversación fluida y respetuosa." : "Respuesta inicial rápida.",
            sellerMetrics.askedQuestions > 0 ? "Realizaste preguntas de calificación antes de tirar precios." : "Buen tono rioplatense."
          ],
          improvements: [
            sellerMetrics.askedQuestions === 0 ? "Evitá dar información de precios sin antes indagar la situación del cliente." : "Conectá más cada beneficio del plan con el dolor puntual que te contó.",
            sellerMetrics.ethicViolations.length > 0 ? `Atención ética: ${sellerMetrics.ethicViolations[0]}` : "Asegurá cerrar siempre proponiendo una acción clara (ej: envío de link de pago)."
          ],
          examplePhrase: selectedProfile.id === 'mama_soltera' 
            ? 'Frase sugerida: "Entiendo perfecto tu situación con los chicos. Por eso la membresía Estándar tiene clases grabadas para que avances a tu ritmo a la noche."'
            : 'Frase sugerida: "Para lo que me contás de independizarte, el plan Premium es el ideal porque combina trading y Hotmart con acompañamiento diario."'
        };

        setEvaluation(report);
        const updatedHistory = [report, ...history];
        setHistory(updatedHistory);
        localStorage.setItem('roleplay_history_v1', JSON.stringify(updatedHistory));
        setGameState('FEEDBACK');
      };

      return (
        <div className="min-h-screen bg-slate-100 font-sans text-slate-800 flex justify-center items-center p-0 sm:p-4">
          <div className="w-full max-w-md bg-white min-h-screen sm:min-h-[840px] sm:h-[840px] sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative border border-slate-200">
            
            {gameState === 'SETUP' && (
              <div className="flex-1 p-6 overflow-y-auto flex flex-col">
                <div className="text-center my-4">
                  <div className="inline-flex items-center justify-center p-3 bg-indigo-100 text-indigo-600 rounded-2xl mb-3">
                    <Sparkles className="w-8 h-8" />
                  </div>
                  <h1 className="text-2xl font-bold text-slate-900">Roleplay de Ventas IA</h1>
                  <p className="text-xs text-slate-500 mt-1">Simulador de objeciones y cierres en español rioplatense</p>
                </div>

                <div className="mb-5">
                  <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">1. Perfil del Cliente</label>
                  <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                    {PROFILES.map((p) => (
                      <div 
                        key={p.id}
                        onClick={() => setSelectedProfile(p)}
                        className={`p-3 rounded-xl border text-left cursor-pointer transition-all ${
                          selectedProfile.id === p.id 
                            ? 'border-indigo-600 bg-indigo-50/50 ring-2 ring-indigo-500/20' 
                            : 'border-slate-200 hover:border-slate-300 bg-white'
                        }`}
                      >
                        <div className="flex justify-between items-center mb-1">
                          <span className="font-bold text-sm text-slate-900">{p.title}</span>
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                            p.difficulty === 'Fácil' ? 'bg-emerald-100 text-emerald-700' :
                            p.difficulty === 'Medio' ? 'bg-amber-100 text-amber-700' : 'bg-rose-100 text-rose-700'
                          }`}>{p.difficulty}</span>
                        </div>
                        <p className="text-xs text-slate-600 line-clamp-2">{p.desc}</p>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3 mb-5">
                  <div>
                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">Dificultad</label>
                    <select 
                      value={difficulty} 
                      onChange={(e) => setDifficulty(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                      <option value="Fácil">Fácil (Receptivo)</option>
                      <option value="Medio">Medio (Normal)</option>
                      <option value="Difícil">Difícil (Escéptico)</option>
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">Canal de Cierre</label>
                    <select 
                      value={closeMode} 
                      onChange={(e) => setCloseMode(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                      <option value="whatsapp">💬 Chat WhatsApp</option>
                      <option value="llamada">📞 Llamada Simulada</option>
                    </select>
                  </div>
                </div>

                <button 
                  onClick={startRoleplay}
                  className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2 text-sm mt-auto"
                >
                  Iniciar Simulación <ChevronRight className="w-4 h-4" />
                </button>

                {history.length > 0 && (
                  <div className="mt-6 border-t pt-4">
                    <span className="text-xs font-bold text-slate-400 uppercase block mb-2">Últimas Prácticas</span>
                    <div className="space-y-2 max-h-24 overflow-y-auto">
                      {history.slice(0, 2).map((h) => (
                        <div key={h.id} className="flex justify-between items-center text-xs p-2 bg-slate-50 rounded-lg border">
                          <div>
                            <span className="font-semibold block text-slate-700">{h.profile}</span>
                            <span className="text-[10px] text-slate-400">{h.date} - {h.result}</span>
                          </div>
                          <span className="font-bold text-indigo-600 text-sm">{h.finalScore}/10</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {gameState === 'PLAYING' && (
              <div className="flex-1 flex flex-col bg-slate-50">
                <div className={`p-3 text-white flex items-center justify-between shadow-md ${stage === 1 ? 'bg-gradient-to-r from-purple-600 to-pink-600' : 'bg-emerald-700'}`}>
                  <div className="flex items-center gap-3">
                    <div className="relative">
                      <div className="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center font-bold text-sm">
                        {selectedProfile.title.charAt(0)}
                      </div>
                      <span className="w-2.5 h-2.5 bg-green-400 rounded-full absolute bottom-0 right-0 border-2 border-white"></span>
                    </div>
                    <div>
                      <h2 className="font-bold text-xs leading-tight">{selectedProfile.title}</h2>
                      <p className="text-[10px] opacity-80">
                        {stage === 1 ? 'Mensaje directo (DM)' : stage === 4 && closeMode === 'llamada' ? '📞 En Llamada...' : 'WhatsApp Business'}
                      </p>
                    </div>
                  </div>

                  <div className="flex items-center gap-2">
                    <button 
                      onClick={getHint}
                      className="p-1.5 bg-white/10 hover:bg-white/20 rounded-lg text-xs font-medium flex items-center gap-1 transition-all"
                      title="Pedir pista al Director de Ventas"
                    >
                      <HelpCircle className="w-4 h-4 text-amber-300" />
                      <span className="hidden sm:inline text-[11px]">Pista</span>
                    </button>
                    <button 
                      onClick={finishRoleplay}
                      className="px-2.5 py-1 bg-white/20 hover:bg-white/30 rounded-lg text-xs font-bold transition-all"
                    >
                      Finalizar
                    </button>
                  </div>
                </div>

                <div className="bg-white border-b px-4 py-1.5 flex justify-between items-center text-[10px] font-semibold text-slate-500">
                  <span className={stage >= 1 ? 'text-indigo-600 font-bold' : ''}>1. Contacto</span>
                  <span>›</span>
                  <span className={stage >= 2 ? 'text-indigo-600 font-bold' : ''}>2. Calificación</span>
                  <span>›</span>
                  <span className={stage >= 3 ? 'text-indigo-600 font-bold' : ''}>3. Oferta</span>
                  <span>›</span>
                  <span className={stage >= 4 ? 'text-indigo-600 font-bold' : ''}>4. Cierre</span>
                </div>

                {hint && (
                  <div className="bg-amber-50 border-b border-amber-200 p-3 text-xs text-amber-800 flex items-start gap-2">
                    <AlertCircle className="w-4 h-4 text-amber-600 shrink-0 mt-0.5" />
                    <div dangerouslySetInnerHTML={{ __html: hint }} />
                  </div>
                )}

                <div className="flex-1 p-4 overflow-y-auto space-y-3">
                  {messages.map((m, idx) => (
                    <div 
                      key={idx} 
                      className={`flex flex-col ${m.sender === 'seller' ? 'items-end' : 'items-start'}`}
                    >
                      <div 
                        className={`max-w-[82%] p-3 rounded-2xl text-xs leading-relaxed shadow-sm ${
                          m.sender === 'seller'
                            ? 'bg-indigo-600 text-white rounded-tr-none'
                            : 'bg-white text-slate-800 border border-slate-200 rounded-tl-none'
                        }`}
                      >
                        {m.text}
                      </div>
                      <span className="text-[9px] text-slate-400 mt-1 px-1">{m.time}</span>
                    </div>
                  ))}

                  {isTyping && (
                    <div className="flex items-center gap-1.5 bg-white border border-slate-200 p-2.5 rounded-2xl w-16 text-slate-400">
                      <span className="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce"></span>
                      <span className="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce"></span>
                      <span className="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce"></span>
                    </div>
                  )}
                  <div ref={chatEndRef} />
                </div>

                {stage === 4 && closeMode === 'llamada' && callActive && (
                  <div className="bg-slate-900 text-white p-3 flex items-center justify-between border-t border-slate-800">
                    <div className="flex items-center gap-2 text-xs">
                      <span className="w-2.5 h-2.5 bg-red-500 rounded-full animate-pulse"></span>
                      <span>Llamada en curso con el cliente...</span>
                    </div>
                    <button 
                      onClick={() => setCallActive(false)}
                      className="px-2 py-1 bg-rose-600 hover:bg-rose-700 text-white rounded text-[10px] font-bold flex items-center gap-1"
                    >
                      <PhoneOff className="w-3 h-3" /> Cortar
                    </button>
                  </div>
                )}

                <form onSubmit={handleSendMessage} className="p-3 bg-white border-t border-slate-200 flex items-center gap-2">
                  <input 
                    type="text" 
                    value={inputText}
                    onChange={(e) => setInputText(e.target.value)}
                    placeholder={stage === 1 ? "Responde al DM..." : "Escribe tu respuesta de venta..."}
                    className="flex-1 bg-slate-100 border-0 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  />
                  <button 
                    type="submit"
                    disabled={!inputText.trim() || isTyping}
                    className="p-2.5 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white rounded-xl transition-all"
                  >
                    <Send className="w-4 h-4" />
                  </button>
                </form>
              </div>
            )}

            {gameState === 'FEEDBACK' && evaluation && (
              <div className="flex-1 p-6 overflow-y-auto flex flex-col bg-slate-50">
                <div className="text-center mb-4">
                  <div className="inline-flex items-center justify-center p-3 bg-indigo-100 text-indigo-600 rounded-2xl mb-2">
                    <Award className="w-8 h-8" />
                  </div>
                  <h2 className="text-xl font-bold text-slate-900">Resultado de la Práctica</h2>
                  <span className={`inline-block mt-1 px-3 py-1 rounded-full text-xs font-bold ${
                    evaluation.result.includes('Cerrada') ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'
                  }`}>
                    {evaluation.result}
                  </span>
                </div>

                <div className="bg-white p-4 rounded-2xl border border-slate-200 mb-4 shadow-sm">
                  <div className="flex justify-between items-center mb-3 border-b pb-2">
                    <span className="text-xs font-bold text-slate-500 uppercase">Puntaje General</span>
                    <span className="text-2xl font-black text-indigo-600">{evaluation.finalScore}/10</span>
                  </div>

                  <div className="grid grid-cols-2 gap-2 text-xs">
                    <div className="p-2 bg-slate-50 rounded-lg">
                      <span className="text-slate-500 block text-[10px]">Rapport / Empatía</span>
                      <span className="font-bold text-slate-800">{evaluation.scores.rapport}/10</span>
                    </div>
                    <div className="p-2 bg-slate-50 rounded-lg">
                      <span className="text-slate-500 block text-[10px]">Calificación</span>
                      <span className="font-bold text-slate-800">{evaluation.scores.qualification}/10</span>
                    </div>
                    <div className="p-2 bg-slate-50 rounded-lg">
                      <span className="text-slate-500 block text-[10px]">Objeciones</span>
                      <span className="font-bold text-slate-800">{evaluation.scores.objections}/10</span>
                    </div>
                    <div className="p-2 bg-slate-50 rounded-lg">
                      <span className="text-slate-500 block text-[10px]">Transparencia Ética</span>
                      <span className="font-bold text-slate-800">{evaluation.scores.ethics}/10</span>
                    </div>
                  </div>
                </div>

                <div className="space-y-3 mb-6">
                  <div className="bg-emerald-50 border border-emerald-200 p-3 rounded-xl text-xs">
                    <h4 className="font-bold text-emerald-800 mb-1 flex items-center gap-1">
                      <CheckCircle className="w-3.5 h-3.5" /> Lo que hiciste bien:
                    </h4>
                    <ul className="list-disc list-inside text-emerald-700 space-y-0.5">
                      {evaluation.strengths.map((s, i) => <li key={i}>{s}</li>)}
                    </ul>
                  </div>

                  <div className="bg-rose-50 border border-rose-200 p-3 rounded-xl text-xs">
                    <h4 className="font-bold text-rose-800 mb-1 flex items-center gap-1">
                      <XCircle className="w-3.5 h-3.5" /> Oportunidades de mejora:
                    </h4>
                    <ul className="list-disc list-inside text-rose-700 space-y-0.5">
                      {evaluation.improvements.map((imp, i) => <li key={i}>{imp}</li>)}
                    </ul>
                  </div>

                  <div className="bg-indigo-50 border border-indigo-200 p-3 rounded-xl text-xs">
                    <h4 className="font-bold text-indigo-800 mb-1 flex items-center gap-1">
                      <TrendingUp className="w-3.5 h-3.5" /> Frase sugerida para la próxima:
                    </h4>
                    <p className="text-indigo-900 italic mt-1">{evaluation.examplePhrase}</p>
                  </div>
                </div>

                <button 
                  onClick={() => setGameState('SETUP')}
                  className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition-all flex items-center justify-center gap-2 text-xs mt-auto"
                >
                  <RefreshCw className="w-4 h-4" /> Volver a Practicar
                </button>
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
